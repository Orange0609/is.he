<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>瀏覽器分頁標題</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: white;
    }

    .player {
      width: 90%;
      max-width: 500px;
      text-align: center;
      padding: 40px 25px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: normal;
    }

    audio {
      width: 100%;
    }

    .artist {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.6;
    }

    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .download-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="player">

    <h1 id="songTitle">歌曲名稱</h1>

    <audio controls id="musicPlayer">
      您的瀏覽器不支援音樂播放。
    </audio>

    <div class="artist" id="songSubtitle">
      副標題
    </div>

    <a
      class="download-btn"
      id="downloadButton"
      href="#"
      download
    >
      🎵 下載音樂 MP3
    </a>

  </div>

  <script>
    // ==============================
    // 歌曲設定：更換歌曲時修改這裡即可
    // ==============================

    // GitHub 儲存庫中的 MP3 檔案名稱
    const musicFile = "是祂 吉他試唱.MP3";

    // 網頁顯示的歌曲標題
    const songTitle = "歌曲名稱";

    // 歌曲副標題
    const songSubtitle = "副標題";

    // 使用者下載時看到的檔案名稱
    const downloadFileName = "下載後的音樂檔名.mp3";


    // ==============================
    // 音樂網址設定
    // ==============================

    // MP3 必須與 index.html 放在同一個資料夾
    const musicUrl = "./" + encodeURIComponent(musicFile);



    // ==============================
    // 顯示歌曲資訊及設定播放器
    // ==============================

    document.getElementById("songTitle").textContent = songTitle;

    document.getElementById("songSubtitle").textContent = songSubtitle;

const musicPlayer = document.getElementById("musicPlayer");

musicPlayer.src = musicUrl;
musicPlayer.load();

musicPlayer.addEventListener("loadedmetadata", function() {
  console.log("音樂載入成功，長度：", musicPlayer.duration);
});

musicPlayer.addEventListener("error", function() {
  console.log("音樂載入失敗：", musicPlayer.error);
});

musicPlayer.load();

musicPlayer.addEventListener("error", function() {
  console.log("音樂載入失敗：", musicPlayer.error);
});


    // ==============================
    // 下載按鈕設定
    // ==============================

    const downloadButton = document.getElementById("downloadButton");

    downloadButton.href = musicUrl;

    downloadButton.download = downloadFileName;

  </script>

</body>
</html>
